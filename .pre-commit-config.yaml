repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^kiro_command_center_frontline_v1/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  # DetecciÃ³n de secretos. Sustituye a gitleaks, que necesita Go o un binario externo
  # y no estÃ¡ instalado en este equipo (ver docs/ambientes.md y progreso.md).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^kiro_command_center_frontline_v1/
  - repo: local
    hooks:
      - id: bloquear-llaves-privadas
        name: Bloquear archivos de llaves y credenciales
        entry: "Archivo de llaves o credenciales no permitido en el repositorio"
        language: fail
        files: (\.pem|\.key|\.p12|(^|/)credentials|(^|/)\.env)$
