# Buildspec de integración (T-016). Definido, NO desplegado: CodePipeline se crea en la
# Fase 8 (T-140). No contiene credenciales: CodeBuild usa el rol de servicio del proyecto.
version: 0.2

env:
  variables:
    CDK_DEFAULT_REGION: us-east-1
    PYTHONIOENCODING: utf-8

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      - pip install uv
      - npm install -g aws-cdk
      - uv sync --python 3.12
  pre_build:
    commands:
      - uv run ruff check .
      - uv run ruff format --check .
  build:
    commands:
      - uv run pytest -q -p no:cacheprovider
      # La guardia de cuenta rechaza la síntesis si la cuenta de CodeBuild no está permitida.
      - cd infra && cdk synth -c ambiente=test --no-notices --quiet && cd ..
      - |
        for f in $(find services lambdas -name Dockerfile 2>/dev/null); do
          docker build -t "cc-ci/$(basename $(dirname $f))" -f "$f" .
        done

artifacts:
  base-directory: infra/cdk.out
  files:
    - "**/*"
