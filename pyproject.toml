[project]
name = "command-center"
version = "0.1.0"
description = "Command Center v1: herramientas de desarrollo del monorepo"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
    "testcontainers[postgres]>=4.8",
]
infra = [
    "aws-cdk-lib>=2.277.0",
    "cdk-nag>=3.0.2",
    "constructs>=10.8.1",
]
servicios = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "cryptography>=43",
    "fastapi>=0.115",
    "google-re2>=1.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=24.4",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", "node_modules", ".venv", "kiro_command_center_frontline_v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Patrón de dependencias de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "cc_common.auth.requiere_permiso", "cc_common.auth.ruta_publica"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "E501", "S603", "S607", "S608"]
# DDL de Alembic: SQL largo y listas constantes interpoladas desde el propio archivo.
"**/migrations/versions/*.py" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["cdk.out", "node_modules", ".venv", "kiro_command_center_frontline_v1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "services/shared", "services/dashboard", "services/colaboradores", "services/campos", "services/constancias", "services/notificaciones", "services/whatsapp"]
testpaths = ["tests", "infra/tests", "services", "lambdas", "scripts"]
addopts = "-ra"
