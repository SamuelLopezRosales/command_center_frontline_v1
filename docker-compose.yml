# Entorno local de pruebas (T-022). Solo para desarrollo: no usa ni necesita AWS.
#   .\scripts\dev.ps1 test-env      (o: docker compose up -d --wait)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: command_center
      POSTGRES_USER: cc_local
      POSTGRES_PASSWORD: cc_local_solo_desarrollo  # pragma: allowlist secret
    ports:
      - "55432:5432"
    volumes:
      - ./tests/fixtures/postgres_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc_local -d command_center"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    # Versión fijada: las versiones de 2026 en adelante pueden exigir token de LocalStack.
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3,sqs,events,sns,ses,secretsmanager,kms,ssm
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
